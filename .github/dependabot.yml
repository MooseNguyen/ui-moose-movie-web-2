version: 2
updates:
  # Covers package.json + pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Ho_Chi_Minh
    # Matches pnpm's minimumReleaseAge: never propose a version published
    # less than a day ago.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # @types/node must match the Node major we run (CI uses Node 24), or
      # TypeScript accepts APIs that do not exist at runtime. Bump it by hand
      # together with the Node version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # react and react-dom must always share the exact same version (React
      # refuses to run otherwise), so they and their types move together.
      # Listed first: Dependabot puts a dependency in the first matching group.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # three ships breaking changes in most minor releases and its types are
      # versioned in lockstep, so they move together and get a focused review
      # (see the threejs migration notes). Listed before dev-dependencies so
      # @types/three lands here, not in the tooling group.
      three:
        patterns: ['three', '@types/three']
      # Tooling bumps are low risk: one PR per week instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']
