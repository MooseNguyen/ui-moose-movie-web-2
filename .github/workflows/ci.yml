name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `version`: the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      # Without the token the build still succeeds but bakes error rows into
      # the ISR Home page, so fail loudly instead.
      - name: Check TMDB token
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::error::TMDB_READ_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - run: pnpm build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
