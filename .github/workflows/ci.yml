name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No `version`: the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      # Without the token the build still succeeds but bakes error rows into
      # the ISR Home page, so fail loudly instead.
      - name: Check TMDB token
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::error::TMDB_READ_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - run: pnpm build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # webServer in playwright.config.ts builds and starts the app itself.
      - run: pnpm e2e
        env:
          CI: true
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

      # Budgets live in lighthouserc.json. `next start` reads TMDB at request
      # time for dynamic routes and ISR revalidation. Uses the Chrome that
      # ubuntu-latest preinstalls.
      - run: pnpm lhci
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

      # Reports stay in the run's artifacts, never public storage; useful
      # even when green to track scores over time.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
